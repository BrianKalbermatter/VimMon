<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AED - Pseudocodigo Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>AED Pseudocodigo</h1>
    <nav id="nav-links"></nav>
  </header>

  <div class="container">
    <!-- Login / Register -->
    <div id="auth-section">
      <div class="tabs">
        <button class="tab active" onclick="showTab('login')">Iniciar sesion</button>
        <button class="tab" onclick="showTab('register')">Registrarse</button>
      </div>

      <div id="auth-alert"></div>

      <div id="login-form" class="card">
        <h2>Iniciar sesion</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label>Contrasena</label>
          <input type="password" id="login-pass">
        </div>
        <button class="btn btn-primary" onclick="login()">Entrar</button>
      </div>

      <div id="register-form" class="card hidden">
        <h2>Registrarse</h2>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="reg-nombre" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label>Contrasena</label>
          <input type="password" id="reg-pass">
        </div>
        <div class="form-group">
          <label>Seccion</label>
          <input type="text" id="reg-seccion" placeholder="A, B, C...">
        </div>
        <div class="form-group">
          <label>Rol</label>
          <select id="reg-role">
            <option value="alumno">Alumno</option>
            <option value="profe">Profesor</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="register()">Crear cuenta</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Check if already logged in
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      if (user.role === 'profe') {
        window.location.href = '/panel';
      } else {
        window.location.href = '/niveles';
      }
    }
    updateNav();
  </script>
</body>
</html>
