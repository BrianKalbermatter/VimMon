<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AED - Panel Profesor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>AED Panel Profesor</h1>
    <nav id="nav-links"></nav>
  </header>

  <div class="container">
    <h2 style="margin-bottom:1rem;">Entregas</h2>

    <div class="filters">
      <div class="form-group">
        <label>Seccion</label>
        <select id="filtro-seccion">
          <option value="">Todas</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nivel</label>
        <select id="filtro-nivel">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="filtro-estado">
          <option value="">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="filtrar()">Filtrar</button>
    </div>

    <div id="alert-box"></div>

    <div style="margin-bottom:0.75rem;">
      <button class="btn btn-success btn-sm" onclick="corregirLote('aprobado')">Aprobar seleccionados</button>
      <button class="btn btn-danger btn-sm" onclick="corregirLote('rechazado')">Rechazar seleccionados</button>
    </div>

    <div id="entregas-list"></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/panel.js"></script>
  <script>
    requireAuth('profe');
    updateNav();
    cargarNivelesPanel();
    filtrar();
  </script>
</body>
</html>
