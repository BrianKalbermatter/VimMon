<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AED - IDE Pseudocodigo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ide-body">
  <header>
    <h1>AED Pseudocodigo</h1>
    <nav id="nav-links"></nav>
  </header>

  <div id="alert-box" style="padding:0 1rem;"></div>

  <!-- Vista 1: Selector de niveles -->
  <div id="vista-niveles" class="container">
    <h2 style="margin-bottom:1.5rem;">Niveles</h2>
    <div id="niveles-grid" class="niveles-grid"></div>
  </div>

  <!-- Vista 2: IDE -->
  <div id="vista-ide" class="ide-container hidden">
    <!-- Panel izquierdo: consigna -->
    <div class="panel-izquierdo" id="panel-izquierdo">
      <button class="btn btn-sm" style="margin-bottom:1rem; background:#334155; color:#94a3b8;" onclick="volverANiveles()">← Volver a niveles</button>
      <h2 id="editor-titulo"></h2>
      <div id="editor-enunciado" class="enunciado"></div>
      <button class="btn btn-sm pista-btn hidden" id="pista-btn" onclick="togglePista()">Ver pista</button>
      <div id="editor-pista" class="pista-content hidden"></div>
      <div class="entregas-section">
        <h3>Mis entregas de este nivel</h3>
        <div id="entregas-nivel"></div>
      </div>
    </div>

    <!-- Panel derecho: editor -->
    <div class="panel-derecho" id="panel-derecho">
      <div class="editor-toolbar">
        <span class="nivel-info" id="editor-nivel-info"></span>
        <button class="btn btn-primary btn-sm" id="btn-enviar" onclick="enviarPaste()" disabled>Enviar</button>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="line-numbers"><span class="line-num">1</span></div>
        <textarea id="editor-content" placeholder="Escribi tu pseudocodigo aca..."></textarea>
      </div>
      <div id="error-summary" class="hidden"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    updateNav();
    initIDE();
  </script>
</body>
</html>
