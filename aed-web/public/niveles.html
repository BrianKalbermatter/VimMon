<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AED - Niveles</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>AED Pseudocodigo</h1>
    <nav id="nav-links"></nav>
  </header>

  <div class="container">
    <h2 style="margin-bottom:1rem;">Niveles</h2>
    <div id="alert-box"></div>
    <div id="niveles-list"></div>

    <!-- Modal para escribir pseudocodigo -->
    <div id="editor-section" class="hidden">
      <div class="card">
        <h2 id="editor-titulo"></h2>
        <div id="editor-enunciado" style="white-space:pre-wrap; margin-bottom:1rem; color:#94a3b8;"></div>
        <button class="btn btn-sm" style="margin-bottom:1rem; background:#334155; color:#fef08a;" onclick="togglePista()">Ver pista</button>
        <div id="editor-pista" class="hidden" style="margin-bottom:1rem; padding:0.5rem; background:#172554; border-radius:4px; color:#fef08a;"></div>
        <div class="form-group">
          <label>Tu pseudocodigo</label>
          <textarea id="editor-content" placeholder="Escribi tu pseudocodigo aca..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="enviarPaste()">Enviar</button>
        <button class="btn" style="background:#475569; color:#e2e8f0; margin-left:0.5rem;" onclick="cerrarEditor()">Cancelar</button>
      </div>
    </div>

    <!-- Mis entregas -->
    <h2 style="margin-top:2rem; margin-bottom:1rem;">Mis entregas</h2>
    <div id="mis-entregas"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    updateNav();
    cargarNiveles();
    cargarMisEntregas();
  </script>
</body>
</html>
