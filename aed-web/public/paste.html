<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AED - Paste</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <header>
    <h1>AED Pseudocodigo</h1>
    <nav id="nav-links"></nav>
  </header>

  <div class="container">
    <div id="paste-content">
      <p style="color:#94a3b8;">Cargando...</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    updateNav();

    (async () => {
      const pasteId = window.location.pathname.split('/').pop();
      try {
        const res = await fetch(`/api/pastes/${pasteId}`);
        if (!res.ok) throw new Error('No encontrado');
        const paste = await res.json();

        const estadoClass = `badge-${paste.estado}`;
        const fecha = new Date(paste.created_at).toLocaleString('es-AR');

        document.getElementById('paste-content').innerHTML = `
          <div class="card">
            <h2>Nivel ${paste.nivel_numero}: ${paste.nivel_titulo}</h2>
            <div class="paste-meta">
              <span>Por: ${paste.nombre}</span>
              <span>Seccion: ${paste.seccion || '-'}</span>
              <span>${fecha}</span>
              <span class="badge ${estadoClass}">${paste.estado}</span>
            </div>
            ${paste.nota_profe ? `<div class="nota-profe"><strong>Nota del profe:</strong> ${escapeHtml(paste.nota_profe)}</div>` : ''}
            <pre><code>${escapeHtml(paste.content)}</code></pre>
          </div>
        `;

        hljs.highlightAll();
      } catch (err) {
        document.getElementById('paste-content').innerHTML =
          '<div class="alert alert-error">Paste no encontrado</div>';
      }
    })();

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
