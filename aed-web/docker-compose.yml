name: aed-pseudocodigo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aed_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aed_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aed:aed_secret@db:5432/aed_db}
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-local}
      PORT: 3000
      PROFE_EMAIL: ${PROFE_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

volumes:
  pgdata:
